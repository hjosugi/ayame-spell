version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    groups:
      site-dependencies:
        patterns:
          - "*"
    ignore:
      # `@astrojs/check` declares a peer of `^5.0.0 || ^6.0.0`, so TypeScript 7
      # only resolves on an incremental install and fails a clean one. Minor
      # and patch updates still flow; drop this once that peer widens.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
      day: monday
    groups:
      vscode-dependencies:
        patterns:
          - "*"
    ignore:
      # typescript-eslint refuses to load against the TypeScript 7 API, so
      # `npm run lint` fails outright. Tracked as typescript-eslint#10940;
      # drop this once that lands.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # The msrv job pins this to the declared MSRV on purpose. Bumping it like
      # an action version would make the job compile with the newest toolchain
      # and still report green, so the MSRV moves with `rust-version` instead.
      - dependency-name: dtolnay/rust-toolchain
