name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose Intel macOS asset should be rebuilt
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }} -p ayame-spell
      - name: Package
        shell: bash
        run: |
          name="ayame-spell-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          if [[ "${{ matrix.os }}" == windows-latest ]]; then
            cp "target/${{ matrix.target }}/release/ayame-spell.exe" "$name/"
          else
            cp "target/${{ matrix.target }}/release/ayame-spell" "$name/"
          fi
          cp LICENSE-MIT LICENSE-APACHE NOTICE.md "$name/"
          cp -R contrib/completions "$name/"
          if [[ "${{ matrix.os }}" == windows-latest ]]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ayame-spell-*.tar.gz
            ayame-spell-*.zip

  repair-intel-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-apple-darwin -p ayame-spell
      - name: Package
        shell: bash
        run: |
          name="ayame-spell-${{ inputs.tag }}-x86_64-apple-darwin"
          mkdir "$name"
          cp target/x86_64-apple-darwin/release/ayame-spell "$name/"
          cp LICENSE-MIT LICENSE-APACHE NOTICE.md "$name/"
          cp -R contrib/completions "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: ayame-spell-*.tar.gz
