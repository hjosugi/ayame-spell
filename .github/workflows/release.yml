name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }} -p ayame-spell
      - name: Package
        shell: bash
        run: |
          name="ayame-spell-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          if [[ "${{ matrix.os }}" == windows-latest ]]; then
            cp "target/${{ matrix.target }}/release/ayame-spell.exe" "$name/"
          else
            cp "target/${{ matrix.target }}/release/ayame-spell" "$name/"
          fi
          cp LICENSE-MIT LICENSE-APACHE NOTICE.md "$name/"
          cp -R contrib/completions "$name/"
          if [[ "${{ matrix.os }}" == windows-latest ]]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ayame-spell-*.tar.gz
            ayame-spell-*.zip
