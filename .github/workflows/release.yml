name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose Intel macOS CLI and VSIX assets should be rebuilt
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify all shipped versions match
        run: python3 packaging/check_versions.py
      - name: Extract release notes from CHANGELOG
        run: |
          bash .github/scripts/extract-release-notes.sh \
            "$GITHUB_REF_NAME" > release-notes.md
          grep -q '[^[:space:]]' release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md

  build:
    if: github.event_name == 'push'
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            vscode_target: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            vscode_target: linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            vscode_target: darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            vscode_target: darwin-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            vscode_target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo build --release --locked
          --target ${{ matrix.target }}
          -p ayame-spell
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci --prefix editors/vscode
      - run: npm run check:version --prefix editors/vscode
      - name: Package CLI and VS Code extension
        shell: bash
        run: |
          name="ayame-spell-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          mkdir -p "editors/vscode/server/${{ matrix.vscode_target }}"
          if [[ "${{ matrix.os }}" == windows-latest ]]; then
            cp "target/${{ matrix.target }}/release/ayame-spell.exe" "$name/"
            cp "target/${{ matrix.target }}/release/ayame-spell.exe" \
              "editors/vscode/server/${{ matrix.vscode_target }}/"
          else
            cp "target/${{ matrix.target }}/release/ayame-spell" "$name/"
            cp "target/${{ matrix.target }}/release/ayame-spell" \
              "editors/vscode/server/${{ matrix.vscode_target }}/"
          fi
          cp LICENSE-MIT LICENSE-APACHE NOTICE.md "$name/"
          cp -R contrib/completions "$name/"
          cp -R contrib/man "$name/"
          if [[ "${{ matrix.os }}" == windows-latest ]]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
          npm run build:production --prefix editors/vscode
          (
            cd editors/vscode
            npx vsce package \
              --target "${{ matrix.vscode_target }}" \
              --out "../../ayame-spell-${GITHUB_REF_NAME}-${{ matrix.vscode_target }}.vsix"
          )
      - name: Smoke-test packaged CLI
        shell: bash
        run: |
          name="ayame-spell-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir artifact-smoke
          if [[ "${{ matrix.os }}" == windows-latest ]]; then
            7z x "$name.zip" -oartifact-smoke
            binary="artifact-smoke/$name/ayame-spell.exe"
          else
            tar xzf "$name.tar.gz" -C artifact-smoke
            binary="artifact-smoke/$name/ayame-spell"
          fi

          test "$("$binary" --version)" = \
            "ayame-spell ${GITHUB_REF_NAME#v}"
          printf 'This is an accomodate release fixture.\n' \
            > artifact-smoke/input.md
          set +e
          "$binary" --format json artifact-smoke/input.md \
            > artifact-smoke/output.jsonl
          status=$?
          set -e
          test "$status" -eq 1
          grep -F '"type":"issue"' artifact-smoke/output.jsonl
          grep -F '"word":"accomodate"' artifact-smoke/output.jsonl
          grep -F '"type":"summary"' artifact-smoke/output.jsonl
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            ayame-spell-*.tar.gz
            ayame-spell-*.zip
            ayame-spell-*.vsix

  checksums:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Generate release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern 'ayame-spell-*'
          (
            cd release-assets
            sha256sum ayame-spell-* > SHA256SUMS
          )
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            release-assets/SHA256SUMS \
            --clobber

  distribution-manifests:
    if: github.event_name == 'push'
    needs: checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download checksums and generate package manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-manifests
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-manifests \
            --pattern SHA256SUMS
          python3 packaging/generate_manifests.py \
            --tag "$GITHUB_REF_NAME" \
            --checksums release-manifests/SHA256SUMS \
            --output-dir release-manifests
          npm ci --ignore-scripts --prefix packages/npm
          npm test --prefix packages/npm
          npm pack ./packages/npm --pack-destination release-manifests
          mv \
            "release-manifests/ayame-spell-${GITHUB_REF_NAME#v}.tgz" \
            "release-manifests/ayame-spell-npm-${GITHUB_REF_NAME}.tgz"
          cp install.sh install.ps1 release-manifests/
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            release-manifests/ayame-spell.rb \
            release-manifests/ayame-spell.json \
            release-manifests/PKGBUILD \
            release-manifests/ayame-spell-bin.SRCINFO \
            release-manifests/install.sh \
            release-manifests/install.ps1 \
            "release-manifests/ayame-spell-npm-${GITHUB_REF_NAME}.tgz" \
            --clobber

  publish-container:
    if: github.event_name == 'push'
    needs: checksums
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  publish-npm:
    if: >-
      github.event_name == 'push' &&
      vars.PUBLISH_NPM == 'true'
    needs: checksums
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install an npm CLI with trusted publishing support
        run: npm install --global npm@11.5.1
      - run: python3 packaging/check_versions.py
      - run: npm ci --ignore-scripts --prefix packages/npm
      - run: npm test --prefix packages/npm
      - name: Publish native wrapper
        run: npm publish ./packages/npm --access public

  publish-crates:
    if: >-
      github.event_name == 'push' &&
      vars.PUBLISH_CRATES == 'true'
    needs: checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify publishing credential is configured
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || {
            echo 'CARGO_REGISTRY_TOKEN is required when PUBLISH_CRATES=true'
            exit 1
          }
      - name: Publish core then CLI
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate_exists() {
            curl --fail --silent --show-error \
              "https://crates.io/api/v1/crates/$1/$version" \
              >/dev/null 2>&1
          }

          if crate_exists ayame-spell-core; then
            echo "ayame-spell-core $version is already published"
          else
            cargo publish --locked -p ayame-spell-core
          fi

          for attempt in {1..12}; do
            crate_exists ayame-spell-core && break
            echo "waiting for ayame-spell-core $version to become available"
            sleep 10
          done
          crate_exists ayame-spell-core

          if crate_exists ayame-spell; then
            echo "ayame-spell $version is already published"
          else
            cargo publish --locked -p ayame-spell
          fi

  publish-vscode:
    if: >-
      github.event_name == 'push' &&
      vars.PUBLISH_VSCODE == 'true'
    needs: checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci --prefix editors/vscode
      - name: Download platform VSIX packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern '*.vsix'
          for target in \
            win32-x64 linux-x64 linux-arm64 darwin-x64 darwin-arm64
          do
            test -f \
              "release-assets/ayame-spell-${GITHUB_REF_NAME}-${target}.vsix"
          done
      - name: Verify publishing credentials are configured
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          test -n "$VSCE_PAT" || {
            echo 'VSCE_PAT is required when PUBLISH_VSCODE=true'
            exit 1
          }
          test -n "$OVSX_PAT" || {
            echo 'OVSX_PAT is required when PUBLISH_VSCODE=true'
            exit 1
          }
      - name: Publish to Visual Studio Marketplace
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          packages=(../../release-assets/*.vsix)
          test "${#packages[@]}" -eq 5
          npx vsce publish \
            --packagePath "${packages[@]}" \
            --skip-duplicate
      - name: Publish to Open VSX
        working-directory: editors/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          packages=(../../release-assets/*.vsix)
          test "${#packages[@]}" -eq 5
          npx ovsx publish \
            --packagePath "${packages[@]}" \
            --skip-duplicate

  repair-intel-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo build --release --locked
          --target x86_64-apple-darwin
          -p ayame-spell
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci --prefix editors/vscode
      - run: npm run check:version --prefix editors/vscode
      - name: Package CLI and VS Code extension
        shell: bash
        run: |
          name="ayame-spell-${RELEASE_TAG}-x86_64-apple-darwin"
          mkdir "$name"
          cp target/x86_64-apple-darwin/release/ayame-spell "$name/"
          cp LICENSE-MIT LICENSE-APACHE NOTICE.md "$name/"
          cp -R contrib/completions "$name/"
          cp -R contrib/man "$name/"
          tar czf "$name.tar.gz" "$name"
          mkdir -p editors/vscode/server/darwin-x64
          cp target/x86_64-apple-darwin/release/ayame-spell \
            editors/vscode/server/darwin-x64/
          npm run build:production --prefix editors/vscode
          (
            cd editors/vscode
            npx vsce package \
              --target darwin-x64 \
              --out "../../ayame-spell-${{ inputs.tag }}-darwin-x64.vsix"
          )
      - name: Smoke-test packaged CLI
        shell: bash
        run: |
          name="ayame-spell-${RELEASE_TAG}-x86_64-apple-darwin"
          mkdir artifact-smoke
          tar xzf "$name.tar.gz" -C artifact-smoke
          binary="artifact-smoke/$name/ayame-spell"

          version="$RELEASE_TAG"
          test "$("$binary" --version)" = \
            "ayame-spell ${version#v}"
          printf 'This is an accomodate release fixture.\n' \
            > artifact-smoke/input.md
          set +e
          "$binary" --format json artifact-smoke/input.md \
            > artifact-smoke/output.jsonl
          status=$?
          set -e
          test "$status" -eq 1
          grep -F '"type":"issue"' artifact-smoke/output.jsonl
          grep -F '"word":"accomodate"' artifact-smoke/output.jsonl
          grep -F '"type":"summary"' artifact-smoke/output.jsonl
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            ayame-spell-*.tar.gz
            ayame-spell-*.vsix
