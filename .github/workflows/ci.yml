name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: registry index is up to date
        run: |
          cargo xtask registry
          git diff --exit-code site/registry/index.json
      - name: shell completions are up to date
        run: |
          cargo xtask completions
          git diff --exit-code -- contrib/completions
      - name: CLI documentation is up to date
        run: |
          cargo xtask cli-docs
          git diff --exit-code -- \
            site/src/content/docs/reference/cli.md \
            site/src/content/docs/ja/reference/cli.md
      - name: rule documentation is up to date
        run: |
          cargo xtask rules-docs
          git diff --exit-code -- \
            site/src/content/docs/reference/rules.md \
            site/src/content/docs/ja/reference/rules.md
      - name: configuration schema is up to date
        run: |
          cargo xtask config-schema
          git diff --exit-code -- site/public/schema/v1/ayame-spell.json
      - name: manual page is up to date
        run: |
          cargo xtask man
          git diff --exit-code -- contrib/man/ayame-spell.1

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.80.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  rustdoc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked

  cli-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ayame-spell --test cli --locked

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --version 0.12.0 --locked
      - name: Run bounded fuzz sessions
        run: |
          for target in fuzz_tokenizer fuzz_japanese fuzz_halfwidth fuzz_config; do
            cargo fuzz run "$target" -- -max_total_time=5 -timeout=10
          done

  performance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate the shared 35 MiB corpus
        run: >-
          python3 contrib/bench/generate_corpus.py
          --output "$RUNNER_TEMP/ayame-corpus.md"
      - name: Measure the proposed revision
        run: |
          cargo build --release --locked -p ayame-spell
          python3 contrib/bench/run_benchmark.py \
            --binary target/release/ayame-spell \
            --corpus "$RUNNER_TEMP/ayame-corpus.md" \
            --repeat 3 \
            --revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/candidate.json"
      - name: Measure origin/main
        run: |
          git worktree add "$RUNNER_TEMP/ayame-main" origin/main
          cargo build \
            --manifest-path "$RUNNER_TEMP/ayame-main/Cargo.toml" \
            --target-dir "$RUNNER_TEMP/ayame-main-target" \
            --release --locked -p ayame-spell
          python3 contrib/bench/run_benchmark.py \
            --binary "$RUNNER_TEMP/ayame-main-target/release/ayame-spell" \
            --corpus "$RUNNER_TEMP/ayame-corpus.md" \
            --repeat 3 \
            --revision origin/main \
            --output "$RUNNER_TEMP/main.json"
      - name: Enforce the regression threshold
        run: >-
          python3 contrib/bench/compare_results.py
          "$RUNNER_TEMP/main.json"
          "$RUNNER_TEMP/candidate.json"
          --max-slowdown-percent 35
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-results
          path: |
            ${{ runner.temp }}/main.json
            ${{ runner.temp }}/candidate.json

  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm audit
      - run: npm run build
      - name: Build language server for integration tests
        run: cargo build --manifest-path ../../Cargo.toml -p ayame-spell
      - name: Run VS Code integration tests
        env:
          AYAME_SPELL_SERVER_PATH: ${{ github.workspace }}/target/debug/ayame-spell
        run: xvfb-run -a npm test
      - name: Validate platform VSIX
        run: |
          mkdir -p server/linux-x64
          cp ../../target/debug/ayame-spell server/linux-x64/
          npx vsce package \
            --target linux-x64 \
            --out ayame-spell-ci-linux-x64.vsix
          unzip -l ayame-spell-ci-linux-x64.vsix |
            grep 'extension/server/linux-x64/ayame-spell'

  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ayame-spell checks its own repository
        run: cargo run -p ayame-spell -- check .

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: npm run check --prefix site
        env:
          I18N_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

  zed-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editors/zed
      - run: >-
          cargo check
          --manifest-path editors/zed/Cargo.toml
          --target wasm32-wasip2
