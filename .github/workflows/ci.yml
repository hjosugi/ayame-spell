name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Dictionary quality fixtures
        run: |
          cargo build -p ayame-spell --locked
          python3 contrib/quality/check_quality.py \
            --binary target/debug/ayame-spell
      - name: registry index is up to date
        run: |
          cargo xtask registry
          git diff --exit-code site/registry/index.json
      - name: shell completions are up to date
        run: |
          cargo xtask completions
          git diff --exit-code -- contrib/completions
      - name: CLI documentation is up to date
        run: |
          cargo xtask cli-docs
          git diff --exit-code -- \
            site/src/content/docs/reference/cli.md \
            site/src/content/docs/ja/reference/cli.md
      - name: rule documentation is up to date
        run: |
          cargo xtask rules-docs
          git diff --exit-code -- \
            site/src/content/docs/reference/rules.md \
            site/src/content/docs/ja/reference/rules.md
      - name: configuration schema is up to date
        run: |
          cargo xtask config-schema
          git diff --exit-code -- site/public/schema/v1/ayame-spell.json
      - name: manual page is up to date
        run: |
          cargo xtask man
          git diff --exit-code -- contrib/man/ayame-spell.1
      - name: shipped integration versions match
        run: python3 packaging/check_versions.py

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  rustdoc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked

  cli-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ayame-spell --test cli --locked

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run bounded fuzz sessions
        run: |
          for target in fuzz_tokenizer fuzz_japanese fuzz_halfwidth fuzz_config; do
            cargo fuzz run "$target" -- -max_total_time=5 -timeout=10
          done

  performance:
    if: >-
      github.event_name == 'pull_request' ||
      github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    env:
      BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate the shared 35 MiB corpus
        run: >-
          python3 contrib/bench/generate_corpus.py
          --output "$RUNNER_TEMP/ayame-corpus.md"
      - name: Measure the proposed revision
        run: |
          cargo build --release --locked -p ayame-spell
          python3 contrib/bench/run_benchmark.py \
            --binary target/release/ayame-spell \
            --corpus "$RUNNER_TEMP/ayame-corpus.md" \
            --repeat 5 \
            --revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/candidate-default.json"
          python3 contrib/bench/run_benchmark.py \
            --binary target/release/ayame-spell \
            --corpus "$RUNNER_TEMP/ayame-corpus.md" \
            --config contrib/quality/ayame-spell.toml \
            --repeat 5 \
            --revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/candidate-dictionary.json"
      - name: Measure the baseline revision
        run: |
          git fetch --no-tags origin "$BASELINE_REF"
          git worktree add "$RUNNER_TEMP/ayame-baseline" "$BASELINE_REF"
          cargo build \
            --manifest-path "$RUNNER_TEMP/ayame-baseline/Cargo.toml" \
            --target-dir "$RUNNER_TEMP/ayame-baseline-target" \
            --release --locked -p ayame-spell
          python3 contrib/bench/run_benchmark.py \
            --binary "$RUNNER_TEMP/ayame-baseline-target/release/ayame-spell" \
            --corpus "$RUNNER_TEMP/ayame-corpus.md" \
            --repeat 5 \
            --revision "$BASELINE_REF" \
            --output "$RUNNER_TEMP/baseline-default.json"
          python3 contrib/bench/run_benchmark.py \
            --binary "$RUNNER_TEMP/ayame-baseline-target/release/ayame-spell" \
            --corpus "$RUNNER_TEMP/ayame-corpus.md" \
            --config contrib/quality/ayame-spell.toml \
            --repeat 5 \
            --revision "$BASELINE_REF" \
            --output "$RUNNER_TEMP/baseline-dictionary.json"
      - name: Enforce the default-mode regression threshold
        run: |
          python3 contrib/bench/compare_results.py \
            "$RUNNER_TEMP/baseline-default.json" \
            "$RUNNER_TEMP/candidate-default.json" \
            --max-slowdown-percent 35 \
            --max-rss-growth-percent 35
      - name: Enforce the dictionary-mode regression threshold
        run: |
          python3 contrib/bench/compare_results.py \
            "$RUNNER_TEMP/baseline-dictionary.json" \
            "$RUNNER_TEMP/candidate-dictionary.json" \
            --max-slowdown-percent 35 \
            --max-rss-growth-percent 35
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-results
          path: ${{ runner.temp }}/*.json

  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm audit
      - run: npm run build
      - name: Build language server for integration tests
        run: cargo build --manifest-path ../../Cargo.toml -p ayame-spell
      - name: Run VS Code integration tests
        env:
          AYAME_SPELL_SERVER_PATH: ${{ github.workspace }}/target/debug/ayame-spell
        run: xvfb-run -a npm test
      - name: Validate platform VSIX
        run: |
          mkdir -p server/linux-x64
          cp ../../target/debug/ayame-spell server/linux-x64/
          npx vsce package \
            --target linux-x64 \
            --out ayame-spell-ci-linux-x64.vsix
          unzip -l ayame-spell-ci-linux-x64.vsix |
            grep 'extension/server/linux-x64/ayame-spell'

  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ayame-spell checks its own repository
        run: cargo run -p ayame-spell -- check .

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: npm run check --prefix site
        env:
          I18N_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

  npm-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/npm/package-lock.json
      - run: npm ci --ignore-scripts --prefix packages/npm
      - run: npm test --prefix packages/npm
      - run: npm pack --dry-run ./packages/npm

  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate installer and manifest generators
        run: |
          sh -n install.sh
          ./install.sh --help
          python3 -m py_compile \
            packaging/check_versions.py \
            packaging/generate_manifests.py
          python3 packaging/test_generate_manifests.py
          python3 packaging/check_versions.py
          python3 packaging/generate_manifests.py \
            --tag v9.8.7 \
            --checksums packaging/testdata/SHA256SUMS \
            --output-dir "$RUNNER_TEMP/manifests"
          grep -F 'version "9.8.7"' "$RUNNER_TEMP/manifests/ayame-spell.rb"
          grep -F '"version": "9.8.7"' "$RUNNER_TEMP/manifests/ayame-spell.json"
          grep -F 'pkgver=9.8.7' "$RUNNER_TEMP/manifests/PKGBUILD"
          grep -F "arch=('x86_64' 'aarch64')" \
            "$RUNNER_TEMP/manifests/PKGBUILD"
          grep -F 'pkgver = 9.8.7' "$RUNNER_TEMP/manifests/.SRCINFO"
          grep -F 'arch = aarch64' "$RUNNER_TEMP/manifests/.SRCINFO"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ayame-spell:ci
      - name: Smoke-test container
        run: |
          test "$(docker run --rm ayame-spell:ci --version)" = \
            "ayame-spell $(python3 -c \
              'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"

  zed-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editors/zed
      - run: >-
          cargo check
          --manifest-path editors/zed/Cargo.toml
          --target wasm32-wasip2
