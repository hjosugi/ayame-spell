[package]
name = "ayame-spell"
description = "Fast, low-noise spell checker for code and prose, for English and Japanese — CLI and LSP server"
keywords = ["spellcheck", "typo", "cli", "lsp", "japanese"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/ayame-spell"

[[bin]]
name = "ayame-spell"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
libc = "0.2"
ayame-spell-core.workspace = true
clap.workspace = true
clap_complete.workspace = true
crossbeam-channel.workspace = true
dialoguer.workspace = true
dirs.workspace = true
ignore.workspace = true
lsp-server.workspace = true
lsp-types.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
regex.workspace = true
toml.workspace = true
toml_edit.workspace = true
ureq.workspace = true

[dev-dependencies]
assert_cmd = "=2.0.17"
insta = "=1.43.2"
proptest.workspace = true
tempfile = "=3.14.0"
