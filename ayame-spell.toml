# ayame-spell checking itself (dogfood config).

[files]
exclude = [
    # dictionary data is not prose
    "site/registry/dicts/**",
    "crates/ayame-spell-core/data/**",
    "third-party/**",
    # Intentional typo/notation fixtures and exact Marketplace mockup text.
    "editors/vscode/test-fixtures/**",
    "editors/vscode/media/source/**",
    "fuzz/corpus/**",
]

[words]
# Deliberate example typos used in tests and documentation.
ignore = [
    "recieve",
    "exmaple",
    "seperate",
    "dashbord",
    "functon",
    "nmae",
    "wrold",
    "definately",
    "occured",
    "zzqqy",
    "zzxqy",
    "teh",
    "aple",
    "neet",
    "stle",
    "サーバ",
    "インタフェース",
]

# The Rust sources embed katakana/fullwidth conversion tables and Japanese
# test fixtures on purpose; the docs show before/after examples of every
# Japanese check.
[[overrides]]
paths = [
    "crates/**",
    "site/src/content/docs/**",
    "site/public/schema/**",
    "README.md",
    "README.ja.md",
    "DESIGN.md",
]
japanese = false
