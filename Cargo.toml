[workspace]
resolver = "2"
members = [
    "crates/ayame-spell-core",
    "crates/ayame-spell",
    "crates/xtask",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hjosugi/ayame-spell"
homepage = "https://hjosugi.github.io/ayame-spell/"
authors = ["hjosugi"]

[workspace.dependencies]
ayame-spell-core = { version = "0.4.0", path = "crates/ayame-spell-core" }

anyhow = "1"
# Exact pins below keep the declared Rust 1.80 MSRV. Later releases that raise
# their MSRV are evaluated deliberately before an upgrade.
clap = { version = "=4.6.4", features = ["derive", "wrap_help"] }
clap_complete = "=4.6.8"
crossbeam-channel = "0.5"
criterion = "=0.8.2"
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
dictgen = "=0.5.3"
dirs = "6"
fst = { version = "0.4", features = ["levenshtein"] }
globset = "=0.4.19"
# Criterion's ciborium dependency accepts older half releases. Pin the newest
# one that still supports the workspace's Rust 1.80 MSRV.
half = "=2.7.1"
ignore = "=0.4.31"
lsp-server = "=0.10.0"
lsp-types = "0.97"
memchr = "2"
proptest = "=1.11.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
toml = "1.1"
toml_edit = "0.25"
typos-dict = "=0.13.31"
unicase = "2"
unicode-normalization = "0.1"
ureq = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
